name: Build Xray Core for Linux AMD64

on:
  push:
    branches:
      - main  # 你可以根据需要修改为你自己的分支
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Step 2: 安装 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.18'  # 根据需要选择 Go 的版本

      # Step 3: 安装依赖
      - name: Install Dependencies
        run: |
          go mod tidy
          go mod vendor

      # Step 4: 静态编译 Xray-core
      - name: Build Xray-core for Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o xray-linux-amd64 -v ./

      # Step 5: 上传编译好的二进制文件
      - name: Upload Linux AMD64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: xray-linux-amd64
          path: xray-linux-amd64

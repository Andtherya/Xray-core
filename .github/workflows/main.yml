name: Build Xray (Static Linux amd64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.20'  # 根据需要调整 Go 版本

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc

    - name: Build Xray (Static and Minimal Binary)
      run: |
        # 确保 Go 的静态链接和最小化二进制
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o xray ./main.go  # 或根据实际路径修改

    - name: Check Binary Size
      run: |
        ls -lh xray

    - name: Upload Binary to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: xray
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

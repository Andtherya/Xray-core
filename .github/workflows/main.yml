name: Build Xray (Static Linux amd64)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Go (Update to Go 1.24)
      uses: actions/setup-go@v3
      with:
        go-version: '1.24'  # 升级到 Go 1.24 或更高版本

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc

    - name: Build Xray (Static and Minimal Binary)
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o xray ./main/main.go

    - name: Check Binary Size
      run: |
        ls -lh xray

    - name: Upload Binary to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: xray
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
